# homekit-ccu lighttpd config
# The configuration UI is served by lighttpd from /addons/homekit-ccu/; its api (and the restore
# upload) go through the same host and port to the config server on 127.0.0.1:39874. The page and
# the api share one origin: no CORS, no extra port in the firewall, and a certificate accepted for
# the WebUI also covers the api (Firefox trusts a self-signed certificate per port).
# No lighttpd auth is switched off here: the config server itself requires a valid CCU admin
# session (sid) for every api call (unless useCCCAuthentication is false in config.json).

$HTTP["url"] =~ "^/addons/homekit-ccu/(api|restore)/" {
  proxy.server = ( "" => ( "homekit-ccu" => ( "host" => "127.0.0.1", "port" => 39874 ) ) )
  proxy.header = ( "map-urlpath" => (
    "/addons/homekit-ccu/api/" => "/api/",
    "/addons/homekit-ccu/restore/" => "/restore/"
  ) )
}
