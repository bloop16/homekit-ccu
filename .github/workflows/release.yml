name: Release

# A pushed tag v<version> releases that commit. "Run workflow" (workflow_dispatch) on master
# releases master: it creates the tag v<package.json version> itself, for sessions that can push
# branches but no tags. The tag it creates does not start this workflow a second time.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Release tag from the package version
        id: tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "a manual release runs on master only, not on $GITHUB_REF" >&2
              exit 1
            fi
            TAG="v$PKG"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "tag $TAG exists already, raise the version first" >&2
              exit 1
            fi
          else
            TAG=$GITHUB_REF_NAME
            if [ "$PKG" != "${TAG#v}" ]; then
              echo "package.json version $PKG does not match tag $TAG" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build addon tarball
        run: cd addon_installer && sh genscript.sh
      - name: Verify tarball layout
        run: tar tzf addon_installer/homekit-ccu-*.tar.gz | grep -qx homekit-ccu.tgz
      - name: Verify offline install of the bundled package
        run: |
          mkdir -p "$RUNNER_TEMP/addon" "$RUNNER_TEMP/offline"
          tar xzf addon_installer/homekit-ccu-*.tar.gz -C "$RUNNER_TEMP/addon"
          cd "$RUNNER_TEMP/offline"
          npm i --offline --no-audit --no-fund --cache "$RUNNER_TEMP/empty-cache" "$RUNNER_TEMP/addon/homekit-ccu.tgz"
          node -e "require('homekit-ccu/lib/Server.js'); require('homekit-ccu/lib/HomeMaticRPC.js')"
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: addon_installer/homekit-ccu-*.tar.gz
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          fail_on_unmatched_files: true
